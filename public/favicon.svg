<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="euBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4084"/>
      <stop offset="100%" stop-color="#041B3B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#D9A700"/>
    </linearGradient>
  </defs>

  <!-- Outer Circle with Gold Border -->
  <circle cx="256" cy="256" r="248" fill="url(#euBg)" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- EU 12 Stars Ring -->
  <g fill="#FFCC00" transform="translate(256, 256) scale(0.92) translate(-256, -256)">
    <!-- Star at 12 o'clock -->
    <path d="M256 36 l5 15 h16 l-13 9 l5 15 l-13 -9 l-13 9 l5 -15 l-13 -9 h16 z" transform="scale(0.8) translate(64, 20)"/>
    <!-- Star at 1 o'clock -->
    <path d="M356 63 l5 15 h16 l-13 9 l5 15 l-13 -9 l-13 9 l5 -15 l-13 -9 h16 z" transform="scale(0.8) translate(89, 32)"/>
    <!-- Star at 2 o'clock -->
    <path d="M429 136 l5 15 h16 l-13 9 l5 15 l-13 -9 l-13 9 l5 -15 l-13 -9 h16 z" transform="scale(0.8) translate(107, 68)"/>
    <!-- Star at 3 o'clock -->
    <path d="M456 236 l5 15 h16 l-13 9 l5 15 l-13 -9 l-13 9 l5 -15 l-13 -9 h16 z" transform="scale(0.8) translate(114, 114)"/>
    <!-- Star at 4 o'clock -->
    <path d="M429 336 l5 15 h16 l-13 9 l5 15 l-13 -9 l-13 9 l5 -15 l-13 -9 h16 z" transform="scale(0.8) translate(107, 160)"/>
    <!-- Star at 5 o'clock -->
    <path d="M356 409 l5 15 h16 l-13 9 l5 15 l-13 -9 l-13 9 l5 -15 l-13 -9 h16 z" transform="scale(0.8) translate(89, 196)"/>
    <!-- Star at 6 o'clock -->
    <path d="M256 436 l5 15 h16 l-13 9 l5 15 l-13 -9 l-13 9 l5 -15 l-13 -9 h16 z" transform="scale(0.8) translate(64, 208)"/>
    <!-- Star at 7 o'clock -->
    <path d="M156 409 l5 15 h16 l-13 9 l5 15 l-13 -9 l-13 9 l5 -15 l-13 -9 h16 z" transform="scale(0.8) translate(39, 196)"/>
    <!-- Star at 8 o'clock -->
    <path d="M83 336 l5 15 h16 l-13 9 l5 15 l-13 -9 l-13 9 l5 -15 l-13 -9 h16 z" transform="scale(0.8) translate(21, 160)"/>
    <!-- Star at 9 o'clock -->
    <path d="M56 236 l5 15 h16 l-13 9 l5 15 l-13 -9 l-13 9 l5 -15 l-13 -9 h16 z" transform="scale(0.8) translate(14, 114)"/>
    <!-- Star at 10 o'clock -->
    <path d="M83 136 l5 15 h16 l-13 9 l5 15 l-13 -9 l-13 9 l5 -15 l-13 -9 h16 z" transform="scale(0.8) translate(21, 68)"/>
    <!-- Star at 11 o'clock -->
    <path d="M156 63 l5 15 h16 l-13 9 l5 15 l-13 -9 l-13 9 l5 -15 l-13 -9 h16 z" transform="scale(0.8) translate(39, 32)"/>
  </g>

  <!-- Central Monogram KÇG -->
  <text 
    x="256" 
    y="295" 
    font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" 
    font-size="160" 
    font-weight="900" 
    fill="url(#goldGrad)" 
    text-anchor="middle"
    letter-spacing="-4"
  >
    KÇG
  </text>
</svg>
